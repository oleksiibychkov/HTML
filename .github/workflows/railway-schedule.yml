name: Railway Schedule (07:00-23:00 Kyiv)

# Автоматичне вмикання/вимикання Railway сервісу для економії годин
# Режим: 07:00-23:00 за київським часом (~480 год/місяць)

on:
  schedule:
    # Вимкнути о 23:00 за Києвом (21:00 UTC зимою, 20:00 UTC влітку)
    - cron: '0 21 * * *'
    # Увімкнути о 07:00 за Києвом (05:00 UTC зимою, 04:00 UTC влітку)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Дія'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop

jobs:
  toggle-railway:
    runs-on: ubuntu-latest
    
    steps:
      - name: Визначити дію
        id: determine-action
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq "21" ] || [ "$HOUR" -eq "20" ]; then
              echo "action=stop" >> $GITHUB_OUTPUT
            else
              echo "action=start" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Обрана дія: $(cat $GITHUB_OUTPUT | grep action | cut -d= -f2)"

      - name: Зупинити сервіс Railway
        if: steps.determine-action.outputs.action == 'stop'
        run: |
          echo "🌙 Зупиняємо сервіс (23:00 за Києвом)..."
          
          RESPONSE=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceUpdate(serviceId: \"'${{ secrets.RAILWAY_SERVICE_ID }}'\", input: { numReplicas: 0 }) { id } }"
            }')
          
          echo "Відповідь Railway: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q "error"; then
            echo "❌ Помилка зупинки сервісу"
            exit 1
          fi
          
          echo "✅ Сервіс зупинено"

      - name: Запустити сервіс Railway
        if: steps.determine-action.outputs.action == 'start'
        run: |
          echo "☀️ Запускаємо сервіс (07:00 за Києвом)..."
          
          RESPONSE=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceUpdate(serviceId: \"'${{ secrets.RAILWAY_SERVICE_ID }}'\", input: { numReplicas: 1 }) { id } }"
            }')
          
          echo "Відповідь Railway: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q "error"; then
            echo "❌ Помилка запуску сервісу"
            exit 1
          fi
          
          echo "✅ Сервіс запущено"

      - name: Статус
        run: |
          echo ""
          echo "================================"
          echo "📊 Розклад роботи сервісу:"
          echo "   🌅 Увімкнення: 07:00 (Київ)"
          echo "   🌙 Вимкнення: 23:00 (Київ)"
          echo "   ⏱️  Робочих годин: ~16 год/день"
          echo "   📅 На місяць: ~480 год"
          echo "   💰 Безкоштовний ліміт: 500 год"
          echo "================================"
