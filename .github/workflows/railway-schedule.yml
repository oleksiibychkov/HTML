name: Railway Schedule

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options:
          - start
          - stop
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 21 * * *'

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Stop
        if: inputs.action == 'stop' || github.event.schedule == '0 21 * * *'
        run: |
          curl -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceUpdate(serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENV_ID }}\", input: { numReplicas: 0 }) }"}'
          echo "Stopped"

      - name: Start
        if: inputs.action == 'start' || github.event.schedule == '0 5 * * *'
        run: |
          curl -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceUpdate(serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENV_ID }}\", input: { numReplicas: 1 }) }"}'
          echo "Started"
