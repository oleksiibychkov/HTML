name: Railway Schedule (07:00-23:00 Kyiv)

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Дія'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop

jobs:
  toggle-railway:
    runs-on: ubuntu-latest
    
    steps:
      - name: Визначити дію
        id: action
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq "21" ]; then
              echo "action=stop" >> $GITHUB_OUTPUT
            else
              echo "action=start" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Зупинити сервіс
        if: steps.action.outputs.action == 'stop'
        run: |
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { serviceInstanceUpdate(serviceId: \"'${{ secrets.RAILWAY_SERVICE_ID }}'\", input: { numReplicas: 0 }) { id } }"}'
          echo "🌙 Сервіс зупинено (23:00 Київ)"

      - name: Запустити сервіс
        if: steps.action.outputs.action == 'start'
        run: |
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { serviceInstanceUpdate(serviceId: \"'${{ secrets.RAILWAY_SERVICE_ID }}'\", input: { numReplicas: 1 }) { id } }"}'
          echo "☀️ Сервіс запущено (07:00 Київ)"