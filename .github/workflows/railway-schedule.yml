name: Railway Schedule

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options:
          - start
          - stop
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 21 * * *'

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link and Stop
        if: inputs.action == 'stop' || github.event.schedule == '0 21 * * *'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service ${{ secrets.RAILWAY_SERVICE_ID }}
          railway scale --replicas 0 || echo "Scale not supported, trying alternative..."
          echo "Stop attempted"

      - name: Link and Start  
        if: inputs.action == 'start' || github.event.schedule == '0 5 * * *'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service ${{ secrets.RAILWAY_SERVICE_ID }}
          railway up --detach || railway redeploy || echo "Redeploy attempted"
          echo "Start attempted"
